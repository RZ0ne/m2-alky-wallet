<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- favicon -->
    <link rel="icon" type="image/icon" href="./assets/img/favicon-r.ico" />

    <!-- bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <!-- css -->

    <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- navbar -->
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand me-5" href="./index.html"><img src="./assets/img/logor.png" class="float-start logo"
                    alt="Alky wallet logo">lky-Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="./index.html">Inicio</a>
                    <a class="nav-link" href="./deposit.html">Deposito</a>
                    <a class="nav-link" href="./sendmoney.html">Enviar Dinero</a>
                    <a class="nav-link" href="./transactions.html">Transacciones</a>
                    <a class="nav-link active" aria-current="page" href="./login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- encabezado -->

    <header class="py-3">
        <h1 class="text-primary text-center text-capitalize">Iniciar Sesión</h1>
    </header>

    <main class="container flex-grow-1">
        <section>
            <div class="row justify-content-center">
                <div class="col-12 col-sm-7 col-lg-5">

                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" class="form-control" name="email" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña:</label>
                            <input type="password" class="form-control" name="password" id="password" required>
                        </div>

                        <div>
                            <input type="submit" class="btn btn-primary" value="Login">
                        </div>
                    </form>

                    <div id="respuestaFormulario" class="alert d-none mt-3 py-2 px-3 small" role="alert"></div>

                </div>
            </div>
        </section>
    </main>

    <footer class="container-fluid bg-secondary text-white text-center py-3">
        Alky Wallet - Todos los derechos reservados
    </footer>
    <!-- jquery -->
    <script src="./assets/js/jquery-4.0.0.min.js"></script>

    <!-- js propio -->
    <script src="./assets/js/login.js"></script>

</body>

</html>
